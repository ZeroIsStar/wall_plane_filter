wall_plane_filter:
  ros__parameters:
    # ========== 通用 / TF ==========
    target_frame: base_link          # 机体系，雷达/深度 ROI 裁剪坐标系
    tf_timeout: 0.25                 # TF 查询超时（秒）
    wall_line_width: 0.04            # Marker 线宽（米）
    wall_display_z: 0.10             # 显示用参考高度（米，部分可视化）
    wall_marker_lifetime: 3.00       # Marker 生命周期（秒）
    wall_marker_publish_hz: 20.0     # Marker 发布上限 Hz（≤0 表示每帧都发）

    # ========== 雷达墙（ROI + 体素 → extract → WallTracker+KF）==========
    # 订阅雷达点云；发布 /wall_plane_filter/lidar_wall_planes 与 lidar_wall_markers
    # 水平距离统一 3m：ROI 与找墙输入一致
    cloud_topic: /vanjee/lidar       # 雷达 PointCloud2 话题
    lidar_wall_enable: true          # 是否做雷达找墙与 Marker
    publish_cloud_filtered: false    # 是否发布 /wall_plane_filter/cloud_filtered（过滤后保留点）
    z_min: 0.05                      # 雷达 ROI：最低高度（target_frame，米）
    z_max: 1.80                      # 雷达 ROI：最高高度（米）
    range_min: 0.20                  # 雷达 ROI：水平距离下限（米）
    range_max: 3.0                   # 雷达 ROI：水平距离上限（米，与深度一致）
    voxel_leaf: 0.05                 # 雷达各向同性体素边长（米）
    lidar_wall_range_max: 3.0        # 找墙用水平距离上限（米，≤ range_max）

    # ========== 拐角锁 / 墙面支撑夹紧（深度与雷达共用）==========
    # corner_snap：非平行墙在端点附近求交，把靠近交点的端点吸附到交点（L 形锁齐）
    # wall_clamp：墙段 a–b 与 z 硬夹紧到本帧找墙点云在 support_band 内的投影范围
    corner_snap_enable: true         # 是否开启拐角端点吸附
    corner_snap_dist: 0.0            # 吸附距离（米）；≤0 则用对应 hough.intersection_extension
    wall_clamp_to_support: true      # 是否按支撑点云夹紧墙面几何
    wall_extent_margin_m: 0.01       # 夹紧时相对支撑极值的余量（米）

    # ========== 深度相机 ==========
    depth_clean_enable: true         # 是否启用深度预处理与发布
    depth_topics:                    # 深度点云订阅话题列表
      - /camera1/depth/points
      - /camera2/depth/points
      - /camera3/depth/points
      - /camera4/depth/points
    depth_wall_cameras: ["camera1", "camera2", "camera3", "camera4"]  # 参与找墙的相机名
    depth_wall_map_frame: map        # 墙跟踪/融合工作坐标系
    depth_wall_output_frame: map     # 发布 wall_planes / markers / 点云的坐标系

    # ---------- 深度预处理（严格顺序）----------
    # 1) crop：Z∈[depth_z_min, depth_z_max]，水平距离∈[depth_range_min, depth_range_max]
    # 2) 各向同性 VoxelGrid：leaf×leaf×leaf（默认 2cm×2cm×2cm）
    # 3) 点数 ≥ depth_ror_min_points 时 RadiusOutlierRemoval 粗剔（可选）
    # 4) StatisticalOutlierRemoval 精修（可选）
    # 5) bilateral：几何双边平滑（对 XYZ）→ filtered=保留点；ROR/SOR 剔除进 deviate
    depth_z_min: 0.05                # 深度 ROI 最低高度（米）
    depth_z_max: 1.70                # 深度 ROI 最高高度（米）
    depth_range_min: 0.10            # 深度 ROI 水平距离下限（米）
    depth_range_max: 3.0             # 深度 ROI 水平距离上限（米）
    depth_voxel_xy: 0.05             # 体素边长（米），XYZ 同为 leaf（2cm×2cm×2cm）
    depth_ror_enable: true           # 是否启用半径离群粗剔（点数够时）
    depth_ror_min_points: 200        # 体素后点数少于此则跳过 ROR
    depth_ror_radius: 0.05           # ROR 搜索半径（米）
    depth_ror_min_neighbors: 4       # 半径内最少邻域点数（含自身规则以 PCL 为准）
    depth_sor_enable: true           # 是否启用统计离群精修
    depth_sor_mean_k: 20             # SOR 邻域点数 K
    depth_sor_stddev_mul: 1.0        # SOR 标准差倍数（越大越宽松）
    depth_bilateral_enable: true     # 是否启用几何双边平滑
    depth_bilateral_sigma_s: 0.04    # 双边空间 sigma（米）
    depth_bilateral_sigma_r: 0.03    # 双边值域 sigma（|Δz|，米）

    # ---------- 发布前墙带裁剪（跟踪之后）----------
    # |n·xy-ρ| ≤ band：保留并可投影到竖直墙；band~outer：甩到 deviate；更远：当障碍物保留
    depth_wall_band_m: 0.05          # 贴墙内带宽度（米）
    depth_wall_band_outer_m: 0.12    # 噪声外带上限（米）；介于 band~outer 的点进 deviate
    depth_wall_project: true         # 带内点是否投影到墙平面
    depth_wall_noise_k: 0.005        # 距离相关噪声带系数：k·r²
    depth_wall_noise_max: 0.06       # 噪声带上限（米）
    depth_wall_range_max: 3.0        # 找墙用水平距离上限（米，与 depth_range_max 一致）
    depth_wall_ground_margin: 0.08   # 地面上抬切掉高度（米）
    depth_ground_ref_z: 0.0          # 地面参考高度（米）
    wall_fuse_min_support_points: 10 # 多相机墙线融合最小支撑点数
    depth_merge_max_age: 0.5         # 融合墙结果可用的最大时间差（秒）
    depth_wall_tf_report_sec: 5.0    # TF 失败率日志周期（秒）

    # ========== 墙跟踪 / KF（深度每相机与雷达共用 wall_track）==========
    # 观测关联 → confirm_frames 确认 → 丢检时 coast（lose_sec）→ 可选 KF 平滑 ρ/θ/端点
    wall_track:
      normal_gate: 0.30              # 关联：法向距离门限（米量级）
      merge_gap: 0.35                # 关联：沿墙方向端点间隙允许（米）
      obs_weight: 0.40               # 非 KF 时观测融合权重（0~1）
      confirm_frames: 2              # 连续命中多少帧才确认输出
      shorten_frames: 5              # 端点连续缩短多少帧才真正缩短（clamp_extent_to_obs=false 时）
      lose_sec: 2.50                 # 确认后丢检保持时长（秒）
      coast_gate_extra: 0.15         # coast 时额外放宽关联门限（米）
      clamp_extent_to_obs: true      # true：匹配更新直接采用观测端点，禁止长出本帧支撑
      kf_enable: true                # 启用 4 维 KF（ρ, θ, 两端弧长参数）
      kf_q_rho: 6.4e-5                # 过程噪声 Q：ρ（米²/时间尺度）
      kf_q_theta: 1e-4             # 过程噪声 Q：θ（弧度²/时间尺度）
      kf_q_end: 6.25e-4                 # 过程噪声 Q：端点（米²/时间尺度）
      kf_r_rho: 2.5e-3               # 观测噪声 R：ρ（米²）
      kf_r_theta: 0.001              # 观测噪声 R：θ（弧度²）
      kf_r_end: 0.01                 # 观测噪声 R：端点（米²）

    # ========== 找线前端 extractor：hough | ransac | seed_grow ==========
    # depth_hough / lidar_hough 可分别配置。

    depth_hough:
      extractor: hough               # 找线算法：hough | ransac | seed_grow
      resolution: 0.05               # 占据栅格分辨率（米/格）
      half_extent: 3.0               # 栅格半边长（米）；与 3m ROI 一致
      max_grid_side: 512             # 栅格单边最大格数
      follow_sensor: true            # true：栅格中心跟随传感器；false：用 origin_*
      origin_x: -3.0                 # follow_sensor=false 时栅格原点 X（米）
      origin_y: -3.0                 # follow_sensor=false 时栅格原点 Y（米）
      min_cell_points: 3             # 栅格占用最少点数
      min_cell_height: 0.05          # 栅格占用最少高度跨度（米，hough 用）
      z_min: 0.05                    # 找墙高度带下限（米）
      z_max: 1.70                    # 找墙高度带上限（米）
      theta_deg: 1.0                 # HoughLinesP 角度分辨率（度）
      votes: 10                      # HoughLinesP 最小投票数
      min_line_length: 0.40          # 最短墙段长度（米）
      hough_max_gap: 0.15            # HoughLinesP 允许间隙（米）
      merge_angle_deg: 6.0           # 候选线合并最大夹角（度）
      merge_distance: 0.08           # 候选线合并法向距离门限（米）
      merge_gap: 0.25                # 候选线合并沿墙间隙允许（米）
      parallel_angle_deg: 10.0       # 小于此夹角视为平行（不做拐角交点，度）
      intersection_extension: 0.50   # 交点允许超出线段端点的距离（米）；也作 corner_snap 默认距
      support_band: 0.12             # 支撑点到直线的法向带宽（米）
      min_support_ratio: 0.65        # 支撑区间命中比例下限（0~1）
      max_unsupported_gap: 0.20      # 允许的最大无支撑间隙（米）
      min_continuous_support: 0.15   # 最短连续支撑长度（米）
      min_support_points: 8          # 最少支撑点数
      max_lines: 80                  # 单帧最多输出墙段数
      refine: true                   # 是否用支撑点 TLS 精修直线
      debug: false                   # 是否输出调试信息
      ransac_distance: 0.0           # RANSAC 内点距离阈值（米）；≤0 用 support_band
      ransac_min_inliers: 20         # RANSAC 最少内点数
      ransac_max_iterations: 150     # RANSAC 最大迭代次数
      ransac_downsample_leaf: 0.04   # RANSAC 前 XY 降采样边长（米）
      seed_contour_angle_deg: 1.0    # seed_grow 方位角分箱（度）
      seed_min_points: 6             # 种子段最少点数
      seed_max_distance: 0.0         # 种子拟合距离阈值（米）；≤0 用 support_band
      grow_distance: 0.0             # 生长距离阈值（米）；≤0 用 support_band
      grow_max_gap_bins: 2           # 生长允许跨越的最大空分箱数
      grow_max_range_jump: 0.35      # 生长相邻分箱最大距离跳变（米）

    lidar_hough:
      extractor: hough               # 找线算法：hough | ransac | seed_grow
      resolution: 0.05               # 占据栅格分辨率（米/格）
      half_extent: 3.0               # 栅格半边长（米）；与 3m ROI 一致
      max_grid_side: 512             # 栅格单边最大格数
      follow_sensor: true            # true：栅格中心跟随传感器；false：用 origin_*
      origin_x: -3.0                 # follow_sensor=false 时栅格原点 X（米）
      origin_y: -3.0                 # follow_sensor=false 时栅格原点 Y（米）
      min_cell_points: 2             # 栅格占用最少点数
      min_cell_height: 0.05          # 栅格占用最少高度跨度（米）
      z_min: 0.05                    # 找墙高度带下限（米）
      z_max: 1.80                    # 找墙高度带上限（米）
      theta_deg: 1.0                 # HoughLinesP 角度分辨率（度）
      votes: 8                       # HoughLinesP 最小投票数
      min_line_length: 0.50          # 最短墙段长度（米）
      hough_max_gap: 0.20            # HoughLinesP 允许间隙（米）
      merge_angle_deg: 6.0           # 候选线合并最大夹角（度）
      merge_distance: 0.10           # 候选线合并法向距离门限（米）
      merge_gap: 0.30                # 候选线合并沿墙间隙允许（米）
      parallel_angle_deg: 10.0       # 小于此夹角视为平行（度）
      intersection_extension: 0.50   # 交点延伸 / corner_snap 默认距（米）
      support_band: 0.15             # 支撑点到直线的法向带宽（米）
      min_support_ratio: 0.60        # 支撑区间命中比例下限（0~1）
      max_unsupported_gap: 0.25      # 允许的最大无支撑间隙（米）
      min_continuous_support: 0.15   # 最短连续支撑长度（米）
      min_support_points: 8          # 最少支撑点数
      max_lines: 80                  # 单帧最多输出墙段数
      refine: true                   # 是否用支撑点 TLS 精修直线
      debug: false                   # 是否输出调试信息
      ransac_distance: 0.0           # RANSAC 内点距离阈值（米）；≤0 用 support_band
      ransac_min_inliers: 25         # RANSAC 最少内点数
      ransac_max_iterations: 150     # RANSAC 最大迭代次数
      ransac_downsample_leaf: 0.05   # RANSAC 前 XY 降采样边长（米）
      seed_contour_angle_deg: 1.0    # seed_grow 方位角分箱（度）
      seed_min_points: 6             # 种子段最少点数
      seed_max_distance: 0.0         # 种子拟合距离阈值（米）；≤0 用 support_band
      grow_distance: 0.0             # 生长距离阈值（米）；≤0 用 support_band
      grow_max_gap_bins: 2           # 生长允许跨越的最大空分箱数
      grow_max_range_jump: 0.40      # 生长相邻分箱最大距离跳变（米）
